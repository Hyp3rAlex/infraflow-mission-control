[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infraflow"
version = "0.1.0"
description = "InfraFlow Mission Control - synthetic IT infrastructure demand-management and portfolio reporting demonstrator"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["openpyxl>=3.1", "python-pptx>=0.6.23", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
infraflow = "infraflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
